<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeSwarm Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #09090b; color: #fafafa; }
        .prose pre { background-color: #18181b; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; }
        .prose code { color: #a1a1aa; font-family: monospace; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.6; }
        .prose h1, .prose h2, .prose h3 { font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; }
        .prose h1 { font-size: 1.5rem; }
        .prose h2 { font-size: 1.25rem; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .prose th, .prose td { border: 1px solid #3f3f46; padding: 0.5rem; text-align: left; }
        .prose th { background-color: #27272a; }
        .prose blockquote { border-left: 4px solid #4f46e5; padding-left: 1rem; color: #a1a1aa; margin-bottom: 1rem;}
        
        .thinking-block {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 0.5rem;
            font-family: monospace;
            color: #a1a1aa;
            font-size: 0.875rem;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
        
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover { background-color: #18181b; }
        .sidebar-item.active { background-color: #27272a; border-left: 3px solid #4f46e5; }
    </style>
</head>
<body class="flex h-screen font-sans overflow-hidden">
    <!-- JWT Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 bg-zinc-950 z-50 hidden flex-col items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl w-full max-w-sm flex flex-col items-center text-center">
            <div class="w-16 h-16 bg-indigo-600 rounded-xl flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-robot text-3xl text-white"></i>
            </div>
            <h2 class="text-2xl font-bold text-zinc-100 mb-2">TradeSwarm AI</h2>
            <p class="text-zinc-400 mb-8 text-sm">Devam etmek için yönetici şifrenizi girin.</p>
            
            <input type="password" id="login-input" placeholder="Şifreniz" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-200 outline-none focus:border-indigo-500 transition-colors mb-4 text-center">
            <button id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl py-3 transition-colors flex items-center justify-center gap-2">
                Giriş Yap
            </button>
            <p id="login-error" class="text-red-400 text-sm mt-4 hidden"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Hatalı şifre, lütfen tekrar deneyin.</p>
        </div>
    </div>


    <!-- Sidebar -->
    <aside class="w-64 bg-zinc-950 border-r border-zinc-800 flex flex-col flex-shrink-0 transition-all duration-300">
        <div class="p-4">
            <button id="new-chat-btn" class="w-full flex items-center justify-center gap-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 py-2.5 px-4 rounded-xl transition-colors font-medium text-sm">
                <i class="fa-solid fa-plus"></i> Yeni Sohbet
            </button>
        </div>
        
        <div class="px-4 py-2 text-xs font-semibold text-zinc-500 uppercase tracking-wider">
            Son Kullanılanlar
        </div>
        
        <div id="session-list" class="flex-1 overflow-y-auto px-2 pb-4 space-y-1">
            <!-- Sessions will be loaded here -->
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full relative bg-zinc-900/30">
        <header class="flex items-center gap-3 px-6 py-4 border-b border-zinc-800 bg-zinc-900/50">
            <div class="p-2 bg-indigo-500/20 rounded-lg">
                <i class="fa-solid fa-chart-network text-indigo-400 text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-zinc-100 tracking-tight">TradeSwarm</h1>
                <p id="header-session-title" class="text-xs text-zinc-400">Yeni Sohbet</p>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 flex flex-col">
            <div class="flex flex-col items-center justify-center h-full text-zinc-500 space-y-4 my-auto" id="empty-state">
                <i class="fa-solid fa-robot text-5xl text-zinc-700"></i>
                <p>Orchestrator ajanı dinliyor. Analiz, trade veya haber isteyebilirsiniz.</p>
            </div>
        </div>

        <footer class="p-4 md:p-6 max-w-4xl mx-auto w-full shrink-0 relative">
            <form id="chat-form" class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 p-2 rounded-2xl shadow-xl focus-within:ring-2 focus-within:ring-indigo-500/50 transition-all">
                <input
                    type="text"
                    id="message-input"
                    placeholder="Mesajınızı yazın..."
                    class="flex-1 bg-transparent border-none text-zinc-200 placeholder-zinc-500 px-4 py-2 focus:outline-none"
                    autocomplete="off"
                />
                <button
                    type="button"
                    id="stop-button"
                    class="hidden p-3 bg-red-600/20 text-red-500 rounded-xl hover:bg-red-600/40 transition-colors"
                    title="Durdur"
                >
                    <i class="fa-solid fa-stop"></i>
                </button>
                <button
                    type="submit"
                    id="send-button"
                    class="p-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </footer>
    </main>

    <script>
                const API_BASE = '/api';
        

        // --- JWT AUTH LOGIC ---
        let jwtToken = localStorage.getItem('tradeswarm_jwt');
        
        const loginOverlay = document.getElementById('login-overlay');
        const loginInput = document.getElementById('login-input');
        const loginBtn = document.getElementById('login-btn');
        const loginError = document.getElementById('login-error');

        const getHeaders = () => {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${jwtToken}`
            };
        };

        const showLogin = () => {
            loginOverlay.style.display = 'flex';
        };

        const hideLogin = () => {
            loginOverlay.style.display = 'none';
        };

        const handleLogin = async () => {
            const password = loginInput.value;
            if (!password) return;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ password })
                });
                if (!res.ok) throw new Error("Şifre Yanlış");
                const data = await res.json();
                jwtToken = data.access_token;
                localStorage.setItem('tradeswarm_jwt', jwtToken);
                hideLogin();
                loadSessions(); // Reload sessions after login
            } catch (e) {
                loginError.style.display = 'block';
            } finally {
                loginBtn.innerHTML = 'Giriş Yap';
            }
        };

        loginBtn.addEventListener('click', handleLogin);
        loginInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        // Intercept fetch responses to catch 401s
        const originalFetch = window.fetch;
        window.fetch = async (...args) => {
            const response = await originalFetch(...args);
            if (response.status === 401) {
                showLogin();
            }
            return response;
        };

        if (!jwtToken) {
            showLogin();
        }
        // ----------------------


        let currentSessionId = null;
        let isGenerating = false;
        let abortController = null;
        let activeSubAgents = {};

        // UI Elements
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatContainer = document.getElementById('chat-container');
        const emptyState = document.getElementById('empty-state');
        const sendButton = document.getElementById('send-button');
        const stopButton = document.getElementById('stop-button');
        const sessionList = document.getElementById('session-list');
        const newChatBtn = document.getElementById('new-chat-btn');
        const headerTitle = document.getElementById('header-session-title');
        newChatBtn.addEventListener('click', handleNewChatBtn);

        // ==========================================
        // SESSIONS MANAGEMENT
        // ==========================================
        async function loadSessions() {
            try {
                const res = await fetch(`${API_BASE}/sessions`, { headers: getHeaders() });
                const sessions = await res.json();
                sessionList.innerHTML = '';
                
                sessions.forEach(session => {
                    // Aktif sohbetin başlığı DB'de güncellendiyse (Yapay Zeka başlık attıysa) başlığı senkronize et
                    if (session.id === currentSessionId) {
                        headerTitle.textContent = session.title;
                    }
                    
                    const btn = document.createElement('div');
                    btn.className = `sidebar-item w-full px-3 py-2.5 rounded-lg text-sm text-zinc-300 flex items-center justify-between group ${session.id === currentSessionId ? 'active text-indigo-300' : ''}`;
                    
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'flex items-center gap-2 truncate cursor-pointer flex-1';
                    titleDiv.innerHTML = `<i class="fa-regular fa-message text-zinc-500"></i> <span class="truncate">${session.title}</span>`;
                    titleDiv.onclick = () => switchSession(session.id, session.title);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'text-zinc-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1 ml-2';
                    deleteBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                    deleteBtn.title = "Sohbeti Sil";
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteSession(session.id);
                    };

                    btn.appendChild(titleDiv);
                    btn.appendChild(deleteBtn);
                    sessionList.appendChild(btn);
                });
            } catch (err) {
                console.error("Session load error", err);
            }
        }

        async function deleteSession(id) {
            if (isGenerating) return;
            if (!confirm('Bu sohbeti tamamen silmek istediğinize emin misiniz?')) return;
            
            try {
                await fetch(`${API_BASE}/sessions/${id}`, { method: 'DELETE', headers: getHeaders() });
                if (id === currentSessionId) {
                    handleNewChatBtn();
                }
                loadSessions();
            } catch (err) {
                console.error("Delete session error", err);
            }
        }

        async function createNewSessionDB() {
            try {
                const res = await fetch(`${API_BASE}/sessions`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ title: "Yeni Sohbet" })
                });
                return await res.json();
            } catch (err) {
                console.error("Create session error", err);
                return null;
            }
        }

        function handleNewChatBtn() {
            if (isGenerating) return;
            currentSessionId = null;
            headerTitle.textContent = "Yeni Sohbet";
            chatContainer.innerHTML = '';
            chatContainer.appendChild(emptyState);
            emptyState.style.display = 'flex';
            
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('active', 'text-indigo-300');
            });
        }

        async function switchSession(id, title) {
            if (isGenerating) return;
            currentSessionId = id;
            headerTitle.textContent = title;
            chatContainer.innerHTML = '';
            
            // Re-fetch sessions to update active class
            await loadSessions();

            // Fetch messages for this session
            try {
                const res = await fetch(`${API_BASE}/sessions/${id}/messages`, { headers: getHeaders() });
                const messages = await res.json();
                
                if (messages.length === 0) {
                    chatContainer.appendChild(emptyState);
                    emptyState.style.display = 'flex';
                } else {
                    emptyState.style.display = 'none';
                    messages.forEach(msg => {
                        // Render past messages
                        const elId = `history-${msg.id}`;
                        createMessageElement(msg.role, elId);
                        
                        // If it has UI state (tool calls, reasoning), render them
                        if (msg.ui_state && msg.ui_state.length > 0) {
                            msg.ui_state.forEach(state => {
                                updateMessage(elId, state.text || '', state.type, state.tool, state);
                            });
                        }
                        // Render final content
                        if (msg.content) {
                            updateMessage(elId, msg.content, 'content', null);
                        }
                    });
                }
                scrollToBottom();
            } catch (err) {
                console.error("Messages load error", err);
            }
        }

        // ==========================================
        // UI RENDERING
        // ==========================================
        function scrollToBottom() {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function createMessageElement(role, id) {
            const div = document.createElement('div');
            div.className = `flex gap-4 max-w-4xl mx-auto w-full ${role === 'user' ? 'flex-row-reverse' : ''}`;
            
            const iconDiv = document.createElement('div');
            iconDiv.className = `w-10 h-10 mt-1 shrink-0 rounded-full flex items-center justify-center ${role === 'user' ? 'bg-zinc-800 text-zinc-300' : 'bg-indigo-600 text-white'}`;
            iconDiv.innerHTML = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';
            
            const contentContainer = document.createElement('div');
            contentContainer.id = `content-container-${id}`;
            
            if (role === 'user') {
                contentContainer.className = `flex flex-col gap-3 max-w-[80%] w-full items-end`;
                const messageBox = document.createElement('div');
                messageBox.id = `message-${id}`;
                messageBox.className = 'rounded-2xl px-5 py-3.5 prose prose-invert w-full bg-zinc-800 text-zinc-200 rounded-tr-sm';
                contentContainer.appendChild(messageBox);
            } else {
                contentContainer.className = `flex flex-col gap-4 max-w-[85%] w-full items-start bg-zinc-900 border border-zinc-800 rounded-2xl rounded-tl-sm px-5 py-4`;
                const typing = document.createElement('div');
                typing.id = `typing-${id}`;
                typing.className = 'flex gap-1 items-center h-6 w-fit';
                typing.innerHTML = `
                    <span class="w-2 h-2 bg-zinc-600 rounded-full animate-pulse"></span>
                    <span class="w-2 h-2 bg-zinc-600 rounded-full animate-pulse" style="animation-delay: 0.2s"></span>
                    <span class="w-2 h-2 bg-zinc-600 rounded-full animate-pulse" style="animation-delay: 0.4s"></span>
                `;
                contentContainer.appendChild(typing);
            }

            div.appendChild(iconDiv);
            div.appendChild(contentContainer);
            chatContainer.appendChild(div);
            
            if (emptyState) emptyState.style.display = 'none';
            scrollToBottom();
            
            return id;
        }

        function updateMessage(id, text, type, toolName, data = {}) {
            const container = document.getElementById(`content-container-${id}`);
            const typingIndicator = document.getElementById(`typing-${id}`);
            
            if (!container) return;

            if (type === 'content') {
                if (typingIndicator) typingIndicator.remove();
                
                const userBox = document.getElementById(`message-${id}`);
                if (userBox) {
                    if (!userBox.dataset.rawText) userBox.dataset.rawText = '';
                    userBox.dataset.rawText += text;
                    userBox.innerHTML = marked.parse(userBox.dataset.rawText);
                    return;
                }

                let lastChild = container.lastElementChild;
                if (!lastChild || !lastChild.classList.contains('prose-content')) {
                    lastChild = document.createElement('div');
                    lastChild.className = 'prose prose-invert w-full text-zinc-300 prose-content';
                    lastChild.dataset.rawText = '';
                    container.appendChild(lastChild);
                }
                
                lastChild.dataset.rawText += text;
                lastChild.innerHTML = marked.parse(lastChild.dataset.rawText);
            } 
            else if (type === 'sub_agent_start') {
                if (typingIndicator) typingIndicator.remove();
                const runId = data.run_id || toolName;
                activeSubAgents[runId] = toolName;
                const agentNames = { 'ask_trader': 'Trader Ajanı', 'ask_researcher': 'Araştırmacı Ajan', 'ask_market_analyzer': 'Piyasa Analisti' };
                const displayName = agentNames[toolName] || toolName;

                const subBox = document.createElement('div');
                subBox.id = `sub-agent-${id}-${runId}`;
                subBox.className = 'w-full bg-zinc-950 border-2 border-indigo-500/30 rounded-xl p-4 shadow-lg flex flex-col';
                subBox.innerHTML = `
                    <div class="flex items-center gap-2 mb-3 text-indigo-400 font-bold uppercase tracking-wider text-sm">
                        <i class="fa-solid fa-user-tie"></i> Alt Ajan Devrede: ${displayName}
                    </div>
                    <div id="sub-agent-tools-${id}-${runId}" class="flex flex-col gap-2 mb-2 w-full empty:hidden"></div>
                    <div id="sub-agent-content-${id}-${runId}" class="text-zinc-300 prose prose-invert w-full text-sm mt-3 border-t border-zinc-800 pt-3">
                        <i class="fa-solid fa-circle-notch fa-spin text-indigo-500"></i> Analiz ediliyor...
                    </div>
                `;
                container.appendChild(subBox);
            }
            else if (type === 'sub_agent_end') {
                const runId = data.run_id || toolName;
                const contentDiv = document.getElementById(`sub-agent-content-${id}-${runId}`);
                if (contentDiv) {
                    contentDiv.innerHTML = marked.parse(text);
                }
                delete activeSubAgents[runId];
            }
            else if (type === 'tool_start') {
                if (typingIndicator) typingIndicator.remove();
                const runId = data.run_id || toolName;
                let targetContainer = null;
                
                if (data.parent_ids && Array.isArray(data.parent_ids)) {
                    for (let pid of data.parent_ids) {
                        if (activeSubAgents[pid]) {
                            targetContainer = document.getElementById(`sub-agent-tools-${id}-${pid}`);
                            break;
                        }
                    }
                }
                
                const toolBadge = document.createElement('div');
                toolBadge.id = `tool-${id}-${runId}`;
                toolBadge.className = 'text-xs text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 rounded-md px-2 py-1.5 w-fit flex items-center gap-2 font-medium';
                toolBadge.innerHTML = `<i class="fa-solid fa-gear fa-spin"></i> <span>Araç çalışıyor: <b>${toolName}</b>...</span>`;
                
                if (targetContainer) {
                    targetContainer.appendChild(toolBadge);
                } else {
                    container.appendChild(toolBadge);
                }
            }
            else if (type === 'tool_end') {
                const runId = data.run_id || toolName;
                const toolBadge = document.getElementById(`tool-${id}-${runId}`);
                if (toolBadge) {
                    toolBadge.className = 'text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 rounded-md px-2 py-1.5 w-fit flex items-center gap-2 font-medium transition-all';
                    toolBadge.innerHTML = `<i class="fa-solid fa-check"></i> <span>Görev bitti: <b>${toolName}</b></span>`;
                }
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message || isGenerating) return;

            // İlk mesaj gönderildiğinde henüz bir sohbet yoksa DB'de oluştur
            if (!currentSessionId) {
                const session = await createNewSessionDB();
                if (session) {
                    currentSessionId = session.id;
                    headerTitle.textContent = session.title;
                }
            }
            
            messageInput.value = '';
            messageInput.disabled = true;
            sendButton.style.display = 'none';
            stopButton.style.display = 'block';
            isGenerating = true;
            
            abortController = new AbortController();
            
            // Add User message
            const uId = 'u-' + Date.now();
            createMessageElement('user', uId);
            updateMessage(uId, message, 'content');
            
            // Add Assistant placeholder
            const msgId = Date.now().toString();
            createMessageElement('assistant', msgId);
            
            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ message: message, session_id: currentSessionId }),
                    signal: abortController.signal
                });

                if (!response.ok) throw new Error('Network error');

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                let done = false;
                let buffer = '';

                while (!done) {
                    const { value, done: readerDone } = await reader.read();
                    done = readerDone;
                    
                    if (value) {
                        buffer += decoder.decode(value, { stream: true });
                        const parts = buffer.split('\n\n');
                        buffer = parts.pop(); 
                        
                        for (const part of parts) {
                            if (part.startsWith('data: ')) {
                                const jsonStr = part.substring(6);
                                try {
                                    const data = JSON.parse(jsonStr);
                                    if (data.type === 'done') {
                                        done = true;
                                        const typingIndicator = document.getElementById(`typing-${msgId}`);
                                        if (typingIndicator) typingIndicator.remove();
                                        // Update sidebar names
                                        loadSessions();
                                    } else {
                                        updateMessage(msgId, data.text || '', data.type, data.tool, data);
                                    }
                                } catch (e) {
                                    console.error('Error parsing JSON:', e, jsonStr);
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    updateMessage(msgId, '\n\n**[İşlem İptal Edildi]**', 'content');
                } else {
                    updateMessage(msgId, '\n\n**Hata:** Sunucuya bağlanılamadı.', 'content');
                    document.getElementById(`message-${msgId}`).classList.add('border-red-900/50', 'bg-red-950/20', 'text-red-400');
                }
            } finally {
                messageInput.disabled = false;
                sendButton.style.display = 'block';
                stopButton.style.display = 'none';
                isGenerating = false;
                messageInput.focus();
            }
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', async () => {
            await loadSessions();
            if (!currentSessionId) {
                // Fetch current list to select first, or show empty
                if (sessionList.children.length > 0) {
                    sessionList.children[0].click();
                } else {
                    handleNewChatBtn();
                }
            }
        });
    </script>
</body>
</html>
