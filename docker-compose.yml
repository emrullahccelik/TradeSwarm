version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tradeswarm-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tradeswarm-backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - .:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradeswarm-frontend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
      - ./frontend/default.conf.template:/etc/nginx/templates/default.conf.template

volumes:
  pgdata:
