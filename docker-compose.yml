services:
  db:
    image: postgres:15-alpine
    container_name: tradeswarm-db
    restart: always
    env_file:
      - .env
    ports:
      # Only reachable from this machine (for running the backend outside Docker), not from the network
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tradeswarm-backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
    # Development setup: source is mounted and hot-reloaded. For a deployment, drop the
    # volume and command so the image's own CMD (no --reload) is used.
    volumes:
      - .:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradeswarm-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
